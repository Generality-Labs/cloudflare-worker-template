name: Worker CI

# Reusable CI for Generality Cloudflare Worker projects: install, type-check,
# test (vitest running inside workerd via @cloudflare/vitest-pool-workers),
# validate the deploy bundle with `wrangler deploy --dry-run`, and the shared
# pre-commit stack (Biome, actionlint, zizmor, mdformat). Consumers call it
# from a thin workflow — see the scaffolded `.github/workflows/ci.yml`.
on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to run against.
        type: string
        default: "22"
      runs-on:
        description: Runner to execute on.
        type: string
        default: ubuntu-latest
      working-directory:
        description: >
          Directory holding package.json. Defaults to the repo root; set to a
          subdirectory for a repo where the Worker isn't at the top.
        type: string
        default: "."
      run-precommit:
        description: Also run the pre-commit stack.
        type: boolean
        default: true
      run-bundle-check:
        description: >
          Also run `wrangler deploy --dry-run` against `bundle-env`, so a
          bundling or configuration error surfaces on the PR rather than at
          deploy time. Needs no Cloudflare credentials. Set false to skip.
        type: boolean
        default: true
      bundle-env:
        description: >
          Wrangler environment the dry run targets. Pass an empty string to
          dry-run the top-level (local) config instead of a named
          environment.
        type: string
        default: production
      bundle-script:
        description: >
          npm script that performs the bundle dry run (for projects that
          need a build step or a second wrangler config). Empty runs `npx
          wrangler deploy --env <bundle-env> --dry-run` directly.
        type: string
        default: ""
      run-online-audits:
        description: >
          Also run zizmor's online audits (the manual-stage pre-commit hook).
          They query the GitHub API about every repo referenced in `uses:`,
          so a consumer whose workflows reference any repo the job's token
          cannot read gets an error rather than a finding. Off by default;
          the template repo itself is public, so enabling this is safe for
          consumers that only reference public repos.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    name: Type-check and test
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate the deploy bundle (wrangler deploy --dry-run)
        if: ${{ inputs.run-bundle-check }}
        env:
          BUNDLE_ENV: ${{ inputs.bundle-env }} # via env to avoid run-step template injection
          BUNDLE_SCRIPT: ${{ inputs.bundle-script }}
        run: |
          if [ -n "$BUNDLE_SCRIPT" ]; then
            npm run "$BUNDLE_SCRIPT"
          else
            npx wrangler deploy --env "$BUNDLE_ENV" --dry-run
          fi

      # uvx runs pre-commit without the project needing any Python setup of
      # its own; the pinned interpreter matches the scaffold's
      # default_language_version so hook environments resolve.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        if: ${{ inputs.run-precommit }}
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        if: ${{ inputs.run-precommit }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-1|${{ runner.os }}|${{ hashFiles(format('{0}/.pre-commit-config.yaml', inputs.working-directory)) }}

      - name: Pre-commit (Biome, actionlint, zizmor, mdformat)
        if: ${{ inputs.run-precommit }}
        env:
          GH_TOKEN: ${{ github.token }} # used by zizmor's online checks when enabled
          RUN_ONLINE_AUDITS: ${{ inputs.run-online-audits }}
        run: |
          args=(run --show-diff-on-failure --color=always --all-files)
          if [ "$RUN_ONLINE_AUDITS" = "true" ]; then
            args+=(--hook-stage manual)
          fi
          uvx pre-commit "${args[@]}"
