name: Worker Deploy

# Reusable deploy for Generality Cloudflare Worker projects: optionally apply
# D1 migrations, `wrangler deploy` a named wrangler environment (via the
# project's npm scripts), then smoke-test a health URL. Consumers call it once
# per environment from the scaffolded `.github/workflows/deploy.yml`.
#
# Each call runs inside the GitHub environment named by `environment`, which
# is where approval gates live: add required reviewers to the `production`
# GitHub environment and the staging -> production hand-off becomes manual.
# The smoke test reads the `HEALTH_URL` *variable* from that same GitHub
# environment and is skipped when it isn't set. It requires a real 200; for a
# Worker behind Cloudflare Access, pass a service token via the
# access-client-id / access-client-secret secrets so the check can get one.
#
# Secrets are passed explicitly rather than via `secrets: inherit` (zizmor
# flags inherit, with reason), which means they resolve in the caller's
# context: store CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID as *repository*
# secrets. Per-environment tokens need `secrets: inherit` in the caller — a
# deliberate, per-repo choice.
on:
  workflow_call:
    inputs:
      environment:
        description: >
          GitHub environment for the deploy job. Conventionally matches the
          wrangler environment the deploy-script targets.
        type: string
        required: true
      deploy-script:
        description: npm script that runs `wrangler deploy --env <env>`.
        type: string
        default: deploy
      migrations-script:
        description: >
          npm script that applies D1 migrations before the deploy. Empty
          skips the step (projects without D1).
        type: string
        default: ""
      node-version:
        description: Node version to run against.
        type: string
        default: "22"
      working-directory:
        description: Directory holding package.json.
        type: string
        default: "."
    secrets:
      cloudflare-api-token:
        description: API token with Workers (and D1, if used) edit permissions.
        required: true
      cloudflare-account-id:
        description: Cloudflare account id.
        required: true
      access-client-id:
        description: >
          Cloudflare Access service-token client id — set when HEALTH_URL sits
          behind Access, so the smoke test can authenticate. Leave unset for a
          publicly reachable Worker.
        required: false
      access-client-secret:
        description: The matching Access service-token client secret.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Before the deploy, so new code never runs against an old schema. The
      # reverse hazard (old code briefly running against the new schema) is
      # the tolerable one — write migrations to be backwards-compatible for
      # one deploy.
      - name: Apply D1 migrations
        if: ${{ inputs.migrations-script != '' }}
        env:
          SCRIPT: ${{ inputs.migrations-script }} # via env to avoid run-step template injection
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
        run: npm run "$SCRIPT"

      - name: Deploy Worker
        env:
          SCRIPT: ${{ inputs.deploy-script }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id }}
        run: npm run "$SCRIPT"

      - name: Smoke test
        if: ${{ vars.HEALTH_URL != '' }}
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          ACCESS_CLIENT_ID: ${{ secrets.access-client-id }}
          ACCESS_CLIENT_SECRET: ${{ secrets.access-client-secret }}
        run: |
          set -euo pipefail
          sleep 5 # let the new version propagate
          auth=()
          if [ -n "$ACCESS_CLIENT_ID" ]; then
            auth=(-H "CF-Access-Client-Id: $ACCESS_CLIENT_ID"
                  -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET")
          fi
          # Require an actual 200. Behind Cloudflare Access an anonymous
          # request gets a 302 to the login page, which `curl -f` counts as
          # success — the Worker itself would never be exercised.
          for attempt in 1 2 3 4; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              ${auth[@]+"${auth[@]}"} "$HEALTH_URL" || echo 000)"
            if [ "$status" = "200" ]; then
              echo "smoke test passed: $HEALTH_URL -> 200"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status"
            sleep 5
          done
          echo "::error::smoke test failed: $HEALTH_URL answered HTTP $status, expected 200. If this Worker is behind Cloudflare Access, set the access-client-id/access-client-secret secrets to a service token allowed by a Service Auth policy on the Access app."
          exit 1
