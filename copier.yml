_subdirectory: template
_min_copier_version: "9.0.0"

# Trim block-tag newlines so conditionals don't leave stray blank lines in
# rendered text/markdown (keeps mdformat happy on a fresh scaffold).
_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_message_after_copy: |
  Worker "{{ project_name }}" scaffolded.

  Next steps:
    cd {{ project_name }}
    npm install
    npm test
    git init && git add -A && git commit -m "Initial commit"
  {% if use_d1 %}
  Create the deployed D1 database(s) and paste each returned id into wrangler.toml:
    npx wrangler d1 create {{ project_name }}
  {% if use_staging %}
    npx wrangler d1 create {{ project_name }}-staging
  {% endif %}
  {% endif %}
  {% if use_r2 %}
  Create the deployed R2 bucket(s):
    npx wrangler r2 bucket create {{ project_name }}
  {% if use_staging %}
    npx wrangler r2 bucket create {{ project_name }}-staging
  {% endif %}

  Apply each deployed bucket's own CORS rules (edit the origins first —
  production must never allow localhost):
    npx wrangler r2 bucket cors set {{ project_name }} --file cors.production.json
  {% if use_staging %}
    npx wrangler r2 bucket cors set {{ project_name }}-staging --file cors.staging.json
  {% endif %}
  {% endif %}
  {% if use_kv %}
  Create the deployed KV namespace(s) and paste each returned id into wrangler.toml:
    npx wrangler kv namespace create {{ project_name }}
  {% if use_staging %}
    npx wrangler kv namespace create {{ project_name }}-staging
  {% endif %}
  {% endif %}

  Deploys run from CI: add CLOUDFLARE_API_TOKEN (Workers Editor + Workers
  Routes Write on the zone) and CLOUDFLARE_ACCOUNT_ID as repository secrets.
  Editor cannot create a Worker, so do the FIRST deploy by hand:
    npx wrangler login && npm run deploy

project_name:
  type: str
  help: Worker / repo name in kebab-case, e.g. "logfile-upload"

project_description:
  type: str
  help: One-line description of the Worker

use_staging:
  type: bool
  # Adds an [env.staging] wrangler environment with its own resources, and a
  # staging deploy job that runs before production on every push to main. Add
  # required reviewers to the `production` GitHub environment to turn the
  # staging -> production hand-off into an approval gate. The top-level
  # wrangler config is local-dev only either way, so declining still keeps
  # local development isolated from production.
  help: Deploy to a staging environment before production?
  default: false

use_d1:
  type: bool
  # Scaffolds a migrations/ directory, per-environment [[d1_databases]]
  # bindings, migration npm scripts, migration application in the deploy
  # pipeline, and a test setup that applies the real migrations to the
  # simulated test database before every run.
  help: Does this Worker use a D1 database?
  default: false

use_r2:
  type: bool
  # Scaffolds per-environment [[r2_buckets]] bindings and per-environment
  # cors.<env>.json files to apply to each bucket (R2 CORS lives on the
  # bucket, not in wrangler.toml; a shared file would leak dev origins like
  # localhost into production).
  help: Does this Worker use an R2 bucket?
  default: false

use_kv:
  type: bool
  # Scaffolds per-environment [[kv_namespaces]] bindings. Deployed namespaces
  # are created with `wrangler kv namespace create` and their returned ids
  # pasted into wrangler.toml; the top-level (local dev) binding is simulated.
  help: Does this Worker use a KV namespace?
  default: false

use_cron:
  type: bool
  # Scaffolds a scheduled() handler and per-environment [triggers] blocks.
  # NOTE: crons fire in every deployed environment that declares them — the
  # scaffold declares them in staging too, so delete that block if the job
  # must not run twice (sends email, hits a paid API, ...).
  help: Does this Worker run on a cron schedule?
  default: false

use_assets:
  type: bool
  # Scaffolds an [assets] block serving public/ (a placeholder index.html is
  # generated) with an ASSETS binding, and a runtime test that fetches it.
  # `assets` is an inheritable wrangler key, so unlike bindings it is
  # declared once at the top level and applies to every environment.
  help: Does this Worker serve static files (a site or SPA) from a public/ directory?
  default: false

use_playwright:
  type: bool
  # Scaffolds a Playwright setup that launches `wrangler dev` as its web
  # server and exercises the Worker over real HTTP. Local-only by design
  # (npm run test:e2e; browsers install once with `npx playwright install
  # chromium`) — CI runs vitest, not Playwright.
  help: Add a Playwright e2e setup (drives the Worker via wrangler dev)?
  default: false

node_version:
  type: str
  help: Node version for CI and deploys (the Worker itself runs on workerd)
  default: "22"

use_typos:
  type: bool
  # Report-only spell-check of code, comments, and docs. Say no for projects
  # whose vocabulary the checker doesn't know — see the template README.
  help: Run the typos spell-checker?
  default: true

use_template_update:
  type: bool
  # Adds a scheduled workflow that runs `copier update` and opens a PR when the
  # template's scaffolded files change. Declining doesn't block updates:
  # `.copier-answers.yml` is written either way, so `uvx copier update` still
  # works by hand.
  help: Open a PR automatically when the template changes? (weekly `copier update`)
  default: true

github_owner:
  type: str
  default: Generality-Labs

author_name:
  type: str
  default: Generality Labs

license:
  type: str
  help: License for the project
  choices:
    "MIT (permissive open source; writes a LICENSE file)": MIT
    "Proprietary (all rights reserved; no LICENSE file)": Proprietary
  default: MIT
