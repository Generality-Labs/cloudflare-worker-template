# scriv settings for this template's own changelog (it has no pyproject.toml).
# Generated projects get theirs in pyproject.toml.
[scriv]
format = md
fragment_directory = changelog.d
categories = Added, Changed, Deprecated, Removed, Fixed, Security, Upgrading
skip_fragments = [A-Z]*
new_fragment_template = file: TEMPLATE.md
entry_title_template = [{{ version }}] - {{ date.strftime('%%Y-%%m-%%d') }}
md_header_level = 2
md_html_anchors = false
compact_fragments = true
